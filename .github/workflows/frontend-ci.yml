name: Frontend CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      #  Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      #  Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      #  Install dependencies
      - name: Install dependencies
        run: npm install

      #  Build Vite project
      - name: Build Vite App
        run: npm run build

      #  Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #  Build Docker image
      - name: Build Docker Image
        run: docker build -t bhashitha22/frontend:latest .

      #  Push Docker image
      - name: Push Docker Image
        run: docker push bhashitha22/frontend:latest